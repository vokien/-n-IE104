<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên Hệ & Đóng Góp Ý Kiến | ScopusVenue</title>
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>

  <!-- HEADER -->
  <header class="site-header" role="banner">
    <div class="container">
      <a href="index.html" class="brand-logo">🎓 Scopus<span>Venue</span></a>
      <nav class="wheel-nav" role="navigation" aria-label="Thanh điều hướng chính">
        <ul>
          <li><a href="index.html">Trang Chủ</a></li>
          <li><a href="venues.html">Tra Cứu Danh Bạ</a></li>
          <li><a href="recommend.html">Khuyến Nghị Bài Báo</a></li>
          <li><a href="timeline.html">Lịch Trình CFP</a></li>
          <li><a href="about.html">Giới Thiệu</a></li>
          <li><a href="sitemap.html">Sơ Đồ Site</a></li>
          <li><a href="contact.html" class="active">Liên Hệ</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button type="button" class="btn-icon" id="theme-toggle-btn"><span class="theme-icon">🌙</span></button>
        <button type="button" class="mobile-menu-btn">☰</button>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container" role="main">
    <header style="margin-bottom: var(--spacing-xl); text-align: center;">
      <h1 style="color: var(--color-primary); font-size: var(--font-size-2xl);">Liên Hệ & Góp Ý</h1>
      <p style="color: var(--color-text-muted); max-width: 600px; margin: 0 auto;">
        Đóng góp ý kiến cải tiến hệ thống hoặc báo cáo sai lệch thông tin hội nghị/tạp chí.
      </p>
    </header>

    <div style="max-width: 600px; margin: 0 auto;">
      <section class="card">
        <form id="contact-form" onsubmit="event.preventDefault(); alert('Cảm ơn bạn đã gửi đóng góp ý kiến!'); this.reset();">
          <div style="margin-bottom: var(--spacing-md);">
            <label for="contact-name" style="display: block; font-weight: 600; margin-bottom: var(--spacing-xs);">Họ và tên của bạn:</label>
            <input type="text" id="contact-name" required placeholder="Nguyễn Văn A" style="width: 100%; padding: var(--spacing-sm); border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-family: inherit;">
          </div>

          <div style="margin-bottom: var(--spacing-md);">
            <label for="contact-email" style="display: block; font-weight: 600; margin-bottom: var(--spacing-xs);">Địa chỉ Email:</label>
            <input type="email" id="contact-email" required placeholder="email@domain.com" style="width: 100%; padding: var(--spacing-sm); border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-family: inherit;">
          </div>

          <div style="margin-bottom: var(--spacing-md);">
            <label for="contact-topic" style="display: block; font-weight: 600; margin-bottom: var(--spacing-xs);">Chủ đề góp ý:</label>
            <select id="contact-topic" style="width: 100%; padding: var(--spacing-sm); border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-family: inherit;">
              <option>Báo cáo sai lệch hạn nộp bài (CFP)</option>
              <option>Đề xuất bổ sung hội nghị / tạp chí mới</option>
              <option>Góp ý về thuật toán gợi ý bài báo</option>
              <option>Góp ý giao diện & trải nghiệm người dùng</option>
            </select>
          </div>

          <div style="margin-bottom: var(--spacing-lg);">
            <label for="contact-message" style="display: block; font-weight: 600; margin-bottom: var(--spacing-xs);">Nội dung tin nhắn:</label>
            <textarea id="contact-message" rows="5" required placeholder="Nhập nội dung chi tiết tại đây..." style="width: 100%; padding: var(--spacing-sm); border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-family: inherit; resize: vertical;"></textarea>
          </div>

          <button type="submit" class="btn-primary" style="width: 100%; padding: var(--spacing-md);">
            ✉️ Gửi Tin Nhắn
          </button>
        </form>
      </section>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer" role="contentinfo">
    <div class="container">
      <div class="footer-bottom">
        <p>Đồ án IE104 - Internet và Công nghệ Web | ThS. Võ Tấn Khoa</p>
      </div>
    </div>
  </footer>

  <script src="./js/storage.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
