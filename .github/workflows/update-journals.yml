name: Update journal data

on:
  # Monthly schedule: 02:00 UTC on the 1st day of each month (09:00 Asia/Ho_Chi_Minh)
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/update-journals.yml'
      - 'tools/journal_update/**'
      - 'data/jour.json'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: journal-update-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/journal_update/requirements.txt
      - run: python -m pip install -r tools/journal_update/requirements.txt
      - run: python -m unittest discover -s tools/journal_update -p 'test_*.py' -v

  refresh:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/journal_update/requirements.txt
      - run: python -m pip install -r tools/journal_update/requirements.txt
      - name: Crawl Special Issues and refresh metrics
        id: refresh
        run: python -u tools/journal_update/refresh.py --batch-size 50
      - name: Retain diagnostic reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: journal-update-diagnostics
          path: .cache/journal_update/report.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Create or update journal pull request
        if: success()
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ github.token }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/update-journals
          delete-branch: false
          add-paths: data/jour.json
          commit-message: '[T3.2] Tự động cập nhật chỉ số tạp chí và Special Issues'
          title: '[T3.2] Cập nhật dữ liệu tạp chí và Special Issues tự động'
          body: |
            Cập nhật tự động `data/jour.json` từ OpenAlex batch API và chuyên mục Call-for-Papers Special Issues bằng Scrapling.

            - Đồng bộ chỉ số học thuật: CiteScore, H-index, homepage URLs.
            - Tự động bổ sung các tạp chí CNTT uy tín mới và thanh lọc các tạp chí dừng hoạt động.
            - Tích hợp hạn nộp bài của các Số đặc biệt (Special Issues) theo chuẩn múi giờ AoE UTC-12.
            - Đã vượt qua kiểm định chuẩn hóa schema 100% không lỗi.
      - name: Enable auto-merge when explicitly configured by the repository
        if: success() && (vars.JOUR_AUTO_MERGE == 'true' || vars.CONF_AUTO_MERGE == 'true') && steps.pr.outputs.pull-request-number != ''
        run: gh pr merge "$PR_NUMBER" --auto --squash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
