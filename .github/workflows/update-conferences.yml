name: Update conference data

on:
  # Daily wake-up; schedule.py selects every third calendar day across month boundaries.
  # 20:17 UTC = 03:17 Asia/Ho_Chi_Minh on the following day.
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/update-conferences.yml'
      - 'tools/conference_update/**'
      - 'data/conf.json'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: conference-update-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false

jobs:
  cadence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.cadence.outputs.due }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: cadence
        run: python tools/conference_update/schedule.py --event "$EVENT" --github-output "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}

  validate:
    needs: cadence
    if: github.event_name == 'pull_request' || needs.cadence.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/conference_update/requirements.txt
      - run: python -m pip install -r tools/conference_update/requirements.txt
      - run: python -m unittest discover -s tools/conference_update -p 'test_*.py' -v

  refresh:
    needs: [cadence, validate]
    if: github.event_name != 'pull_request' && needs.cadence.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 280
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Always base the data PR on the default branch, including manual dispatch.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/conference_update/requirements.txt
      - run: python -m pip install -r tools/conference_update/requirements.txt
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/conference-update
          key: conferences-v1-${{ hashFiles('tools/conference_update/*.py', 'tools/conference_update/seed.json', 'tools/conference_update/requirements.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            conferences-v1-${{ hashFiles('tools/conference_update/*.py', 'tools/conference_update/seed.json', 'tools/conference_update/requirements.txt') }}-
      - name: Crawl, preprocess and validate
        id: crawl
        run: python -u tools/conference_update/refresh.py --workers 4 --max-minutes 240
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Keep checkpoints even when a source fails
        if: always() && hashFiles('.cache/conference-update/state.json') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/conference-update
          key: conferences-v1-${{ hashFiles('tools/conference_update/*.py', 'tools/conference_update/seed.json', 'tools/conference_update/requirements.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain diagnostic reports outside Git history
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: conference-update-diagnostics
          path: |
            .cache/conference-update/state.json
            .cache/conference-update/report.json
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Create or update the same data pull request
        if: success()
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ github.token }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/update-conferences
          delete-branch: false
          add-paths: data/conf.json
          commit-message: '[T3.2] Tự động cập nhật và làm sạch dữ liệu hội nghị'
          title: '[T3.2] Cập nhật dữ liệu hội nghị tự động'
          body: |
            Cập nhật tự động `data/conf.json` từ hệ thống đa nguồn: CCF Deadlines, AI-Deadlines, Sec-Deadlines, SE-Deadlines và WikiCFP.

            - Tự động bổ sung các hội nghị uy tín mới phát hiện và đồng bộ hạn nộp bài mới nhất.
            - Tự động thanh lọc các hội nghị không còn đợt Call-for-Papers nào trong tương lai.
            - Chuẩn hóa múi giờ chuẩn AoE (UTC-12), đồng hồ đếm ngược và bảng xếp hạng CORE (A*, A, B, C).
            - Tích hợp cơ chế chống sập mạng toàn diện (Universal Network Resilience), tự động chuyển đổi nguồn an toàn khi WikiCFP hoặc máy chủ mạng bên ngoài gặp sự cố.
            - Journal không thay đổi. Báo cáo chi tiết nằm trong artifact của lượt Actions này.
      - name: Enable auto-merge when explicitly configured by the repository
        if: success() && vars.CONF_AUTO_MERGE == 'true' && steps.pr.outputs.pull-request-number != ''
        run: gh pr merge "$PR_NUMBER" --auto --squash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
